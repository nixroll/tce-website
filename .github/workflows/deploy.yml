name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci требует package-lock.json, которого пока нет в репозитории
        # (я не могу сгенерировать его локально — npm registry заблокирован
        # в моей песочнице). npm install работает и без лока.
        run: npm install

      # GITHUB_PAGES=true переключает сборку в режим превью: pathPrefix
      # "/tce-website/" и origin https://nixroll.github.io (см. разбор в
      # eleventy.config.js и src/_data/site.js). Без этой переменной
      # `npm run build` собирает БОЕВОЙ вариант под thermoconcept.by —
      # именно он заливается на хостинг. Флаг стоит только здесь, чтобы
      # нельзя было случайно выложить на домен сборку с чужими путями.
      - name: Build site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
