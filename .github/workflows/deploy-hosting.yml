# Автоматическая выкладка сайта на хостинг hoster.by по FTP.
#
# Что делает: при каждом пуше в master собирает боевой вариант сайта
# (под домен thermoconcept.by, без префикса GitHub Pages — см. разбор в
# eleventy.config.js) и заливает его на хостинг. Ручная загрузка архива
# после этого не нужна: поправили текст -> запушили -> через пару минут
# сайт обновился.
#
# Заливаются только ИЗМЕНИВШИЕСЯ файлы: действие хранит на сервере
# служебный файл .deploy-sync-state.json со списком того, что уже там
# лежит, и сравнивает с новой сборкой. Поэтому первый запуск льёт все
# ~57 МБ и идёт долго (видео), а последующие — секунды.
#
# --------------------------------------------------------------------
# ЧТО НУЖНО НАСТРОИТЬ ОДИН РАЗ (без этого workflow не запустится)
# --------------------------------------------------------------------
# Реквизиты FTP приходят письмом от hoster.by ("Реквизиты доступов к
# хостингу") сразу после оплаты. Их НЕЛЬЗЯ писать прямо в этом файле —
# он публичный. Они кладутся в защищённое хранилище GitHub:
#
#   Репозиторий -> Settings -> Secrets and variables -> Actions
#
#   Вкладка "Secrets", кнопка "New repository secret", три штуки:
#     FTP_SERVER    — адрес FTP-сервера из письма (например ftp.hoster.by)
#     FTP_USERNAME  — логин FTP
#     FTP_PASSWORD  — пароль FTP
#
#   Вкладка "Variables", кнопка "New repository variable", одна штука:
#     FTP_DEPLOY    = true
#
# FTP_DEPLOY — рубильник. Пока он не выставлен в true, задача просто
# пропускается: это чтобы workflow не падал с ошибкой на каждом пуше в
# те дни, пока хостинг ещё не оплачен и реквизитов нет.
#
# --------------------------------------------------------------------
# ПРО ОТДЕЛЬНОГО FTP-ПОЛЬЗОВАТЕЛЯ
# --------------------------------------------------------------------
# Логин из письма hoster.by — от ВСЕЙ панели: файлы, почта, настройки,
# базы. Отдавать его GitHub не нужно. В панели (раздел
# "FTP-пользователи") заводится отдельный пользователь, у которого
# домашняя директория выставлена в /www/thermoconcept.by — то есть он
# физически не видит ничего за пределами папки сайта.
#
# Отсюда server-dir: "./" — FTP-сессия такого пользователя стартует уже
# ВНУТРИ папки сайта, дописывать путь не нужно. Если бы заливка шла под
# основным логином, здесь было бы "./www/thermoconcept.by/" (корневая
# директория сайта из раздела "Сайты" панели).
#
# Плюс на будущее: чтобы отозвать у GitHub доступ, достаточно удалить
# этого пользователя — основной пароль менять не придётся.

name: Deploy to hoster.by

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # Рубильник: пока переменная не выставлена, задача не выполняется.
    if: vars.FTP_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Без GITHUB_PAGES собирается боевой вариант: пути от корня домена
      # и origin https://thermoconcept.by в og:image/canonical.
      - name: Build site
        run: npm run build

      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # 18.08. Первый запуск с protocol: ftps упал на
          # "Client is closed because read ECONNRESET (data socket)".
          #
          # Что это значит: у FTP два соединения — управляющее (команды)
          # и отдельное для самих файлов. Управляющее поднялось и логин
          # прошёл (иначе была бы ошибка авторизации), а канал данных
          # сервер оборвал. Типичных причин две: сервер не принимает
          # шифрование на канале данных так, как его согласует клиент,
          # либо закрыт диапазон портов пассивного режима.
          #
          # Пробуем без шифрования, чтобы отделить одно от другого. Если
          # заработает — причина была в TLS на канале данных, и тогда
          # стоит перейти на SFTP (порт 22, он указан в письме
          # hoster.by): там всё идёт одним зашифрованным соединением, без
          # отдельного канала данных и без пассивных портов, то есть без
          # этого класса проблем вообще.
          #
          # Риск на время проверки ограничен: у пользователя доступ
          # только к папке сайта, никаких персональных данных, а пароль
          # в любой момент меняется в панели за минуту.
          protocol: ftp
          port: 21
          # Подробный лог: если снова упадёт, в выводе будут видны
          # реальные ответы сервера, а не только итоговая ошибка.
          log-level: verbose
          timeout: 60000
          local-dir: ./_site/
          # Пусто = корень FTP-сессии. Он же папка сайта, потому что у
          # deploy-пользователя домашняя директория = /www/thermoconcept.by
          # (см. разбор выше).
          server-dir: ./
          # Не трогаем на сервере то, что положено туда не нами:
          # служебные файлы панели и статистику логов.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/**
            **/tmp/**
